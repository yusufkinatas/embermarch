<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Embermarch Render Gallery</title>
    <style>
      :root {
        --panel: #1a1612;
        --panel-light: #2a231c;
        --border: #6b4f2a;
        --text: #f4e6c1;
        --muted: #a8987a;
        --accent: #e8a33d;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 16px 20px 40px;
        background: #110e0b;
        color: var(--text);
        font: 14px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      h1 { margin: 0 0 4px; font-size: 22px; letter-spacing: 0.04em; color: var(--accent); }
      h2 { margin: 28px 0 10px; font-size: 16px; color: var(--accent); border-bottom: 1px solid var(--border); padding-bottom: 4px; }
      .muted { color: var(--muted); }
      .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; }
      .card { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 8px; }
      .controls { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin: 8px 0; }
      .controls label { display: inline-flex; gap: 6px; align-items: center; }
      select, button, input { font: inherit; }
      button { background: var(--panel-light); color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 4px 10px; cursor: pointer; }
      canvas { display: block; }
      #perf { font-family: ui-monospace, monospace; white-space: pre; }
      .caption { font-size: 11px; color: var(--muted); text-align: center; margin-top: 2px; }
    </style>
  </head>
  <body>
    <div id="gallery"></div>
    <script type="module" src="/src/render/gallery.ts"></script>
  </body>
</html>
